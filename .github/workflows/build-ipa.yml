name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/house-capture
        run: xcodegen generate

      - name: Build (no code signing)
        working-directory: apps/house-capture
        run: |
          set -o pipefail
          xcodebuild \
            -project HouseCapture.xcodeproj \
            -scheme HouseCapture \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package into .ipa
        working-directory: apps/house-capture
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HouseCapture.app Payload/
          zip -qry HouseCapture.ipa Payload
          ls -lh HouseCapture.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HouseCapture-ipa
          path: apps/house-capture/HouseCapture.ipa
          if-no-files-found: error
